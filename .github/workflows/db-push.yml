name: Deploy DB migrations (production)

# Applies any new supabase/migrations/*.sql to the production database
# on merge to main, so prod can't silently fall behind the repo.
# This is the enforced apply path described in docs/migrations.md —
# don't apply prod migrations out-of-band (CLI is the source of truth).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-push.yml"
  # Manual trigger for validating the secrets end-to-end in a clean env.
  # Leave dry_run = true to authenticate + list pending migrations without applying.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List migrations without applying (credential check only)"
        type: boolean
        default: true

# Never let two pushes race on the same database.
concurrency:
  group: db-push-production
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # Scope the secrets below to a GitHub "production" environment so you can
    # add required reviewers / branch protection to the deploy if you want.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      PROD_PROJECT_REF: avakcpjthtrmeswgjlxz # rsw-production (not secret — already in docs/migrations.md)
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.102.0

      - name: Link production project
        run: supabase link --project-ref "$PROD_PROJECT_REF"

      - name: Apply pending migrations
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — authenticating and listing pending migrations only."
            supabase db push --dry-run
          else
            supabase db push
          fi
