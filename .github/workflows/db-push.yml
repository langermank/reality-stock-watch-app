name: Deploy DB migrations (production)

# Applies any new supabase/migrations/*.sql to the production database
# on merge to main, so prod can't silently fall behind the repo.
# This is the enforced apply path described in docs/migrations.md —
# don't apply prod migrations out-of-band (CLI is the source of truth).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-push.yml"

# Never let two pushes race on the same database.
concurrency:
  group: db-push-production
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # Scope the secrets below to a GitHub "production" environment so you can
    # add required reviewers / branch protection to the deploy if you want.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      PROD_PROJECT_REF: avakcpjthtrmeswgjlxz # rsw-production (not secret — already in docs/migrations.md)
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$PROD_PROJECT_REF"

      - name: Apply pending migrations
        run: supabase db push
