[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "11"

# Preview deploys (every PR) use staging Supabase — set in Netlify dashboard:
#   NEXT_PUBLIC_SUPABASE_URL        → staging project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   → staging anon key
#   SUPABASE_SERVICE_ROLE_KEY       → staging service role key
#   VAPID_PUBLIC_KEY                → same as production
#   VAPID_PRIVATE_KEY               → same as production

# Production (main branch) uses production Supabase — set in Netlify dashboard:
#   NEXT_PUBLIC_SUPABASE_URL        → production project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   → production anon key
#   SUPABASE_SERVICE_ROLE_KEY       → production service role key
#   VAPID_PUBLIC_KEY                → same as staging
#   VAPID_PRIVATE_KEY               → same as staging
